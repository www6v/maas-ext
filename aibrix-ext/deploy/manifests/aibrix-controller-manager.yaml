# AIBrix Controller Manager - 本地构建版本
# 镜像: aibrix/controller-manager:v0.7.0 (从源码编译)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aibrix-controller-manager
  namespace: aibrix-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aibrix-controller-manager-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: aibrix-controller-manager
  namespace: aibrix-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibrix-controller-manager
  namespace: aibrix-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: aibrix
    app.kubernetes.io/component: aibrix-controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/component: aibrix-controller-manager
    spec:
      serviceAccountName: aibrix-controller-manager
      securityContext:
        runAsNonRoot: false
      containers:
      - name: manager
        image: aibrix/controller-manager:v0.7.0
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8080
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        env:
        - name: AIBRIX_GATEWAY_TIMEOUT_SECONDS
          value: "120"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: aibrix-webhook-server-cert
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aibrix-controller-manager-metrics
  namespace: aibrix-system
  labels:
    control-plane: controller-manager
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    control-plane: controller-manager
