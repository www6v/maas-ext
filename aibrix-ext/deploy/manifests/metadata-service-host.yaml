# metadata-service running on host machine
apiVersion: v1
kind: Service
metadata:
  name: metadata-service
  namespace: aibrix-system
spec:
  clusterIP: None
  ports:
  - port: 8090
    targetPort: 8090
---
apiVersion: v1
kind: Endpoints
metadata:
  name: metadata-service
  namespace: aibrix-system
subsets:
- addresses:
  - ip: 172.17.0.1   # docker0 bridge IP - host machine
  ports:
  - port: 8090
    protocol: TCP
