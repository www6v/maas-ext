apiVersion: v1
kind: ConfigMap
metadata:
  name: aibrix-envoy-config
  namespace: aibrix-system
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 80
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: local_service
                          domains: ["*"]
                          routes:
                            # All API endpoints route to vllm-service via gateway-plugins
                            - match:
                                prefix: "/v1/"
                              route:
                                cluster: vllm_cluster
                                timeout: 600s
                            - match:
                                prefix: "/"
                              route:
                                cluster: vllm_cluster
                                timeout: 600s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: vllm_cluster
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: vllm_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: vllm-service.default.svc.cluster.local
                          port_value: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibrix-envoy
  namespace: aibrix-system
  labels:
    app: aibrix-envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aibrix-envoy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: aibrix-envoy
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.33.2
          command: ["/usr/local/bin/envoy"]
          args: ["--log-level", "info", "--config-path", "/etc/envoy/envoy.yaml"]
          ports:
            - name: http
              containerPort: 80
            - name: admin
              containerPort: 9901
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: envoy-config
          configMap:
            name: aibrix-envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: aibrix-envoy
  namespace: aibrix-system
spec:
  type: NodePort
  selector:
    app: aibrix-envoy
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
