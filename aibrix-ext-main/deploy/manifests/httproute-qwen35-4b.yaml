apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen3.5-4b-router
  namespace: aibrix-system
  labels:
    model.aibrix.ai/name: qwen3.5-4b
spec:
  parentRefs:
    - name: aibrix-eg
      namespace: aibrix-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/completions
        - path:
            type: PathPrefix
            value: /v1/chat/completions
        - path:
            type: PathPrefix
            value: /v1/responses
        - path:
            type: PathPrefix
            value: /v1/embeddings
        - path:
            type: PathPrefix
            value: /v1/rerank
        - path:
            type: PathPrefix
            value: /v1/classify
        - path:
            type: PathPrefix
            value: /tokenize
      backendRefs:
        - name: vllm-service
          namespace: default
          port: 8000
