# gateway-plugin running on host machine
apiVersion: v1
kind: Service
metadata:
  name: aibrix-gateway-plugins
  namespace: aibrix-system
spec:
  clusterIP: None
  ports:
  - name: gateway
    port: 50052
    targetPort: 50052
  - name: metrics
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: aibrix-gateway-plugins
  namespace: aibrix-system
subsets:
- addresses:
  - ip: 172.17.0.1   # docker0 bridge IP - host machine
  ports:
  - name: gateway
    port: 50052
    protocol: TCP
  - name: metrics
    port: 8080
    protocol: TCP
